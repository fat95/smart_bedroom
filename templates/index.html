<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Smart Bedroom - Tích hợp Hệ thống (Phần C)</title>
    <style>
        body { margin: 0; background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 1. KHU VỰC WIDGETS */
        .visualizer-grid {
            flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 15px; padding: 15px; background: #020617;
        }
        .widget {
            background: #1e293b; border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; transition: 0.4s ease;
        }
        .widget-title { position: absolute; top: 12px; left: 15px; font-size: 11px; color: #cbd5e1; font-weight: bold; letter-spacing: 1px; z-index: 10;}
        .icon-box { font-size: 50px; transition: all 0.3s; z-index: 5; }

        /* Điều hòa */
        #ac-temp-display { font-size: 22px; font-weight: bold; margin-top: 5px; color: white; opacity: 0; transition: 0.3s; z-index: 5;}
        #ac-status { font-size: 12px; margin-top: 2px; opacity: 0; font-weight: bold; z-index: 5;}
        
        /* Đèn */
        .lamp-icon { color: #475569; transition: 0.3s; }
        
        /* Giường */
        .css-bed { position: relative; width: 110px; height: 50px; display: flex; align-items: flex-end; z-index: 5;}
        .bed-base { position: absolute; bottom: 0; left: 0; width: 100%; height: 16px; background: #475569; border-radius: 4px; }
        .bed-foot { position: absolute; bottom: 16px; right: 0; width: 60%; height: 16px; background: #cbd5e1; border-radius: 6px 6px 0 0; }
        .bed-head { position: absolute; bottom: 16px; left: 0; width: 40%; height: 16px; background: #94a3b8; border-radius: 6px 0 0 0; transform-origin: bottom right; transition: transform 0.4s ease; }
        .bed-pillow { position: absolute; top: -10px; left: 8px; width: 25px; height: 10px; background: #fff; border-radius: 8px; }

        /* Tivi */
        .tv-frame { width: 170px; height: 95px; background: #000; border: 4px solid #1e293b; border-radius: 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .tv-screen { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: background 0.3s; }
        .tv-logo { font-size: 18px; font-weight: bold; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .tv-vol-ui { font-size: 10px; color: #94a3b8; margin-top: 5px; }

        /* 2. THANH THÔNG TIN */
        .environment-bar { background: #1e293b; border-top: 1px solid #334155; border-bottom: 1px solid #334155; padding: 8px 20px; display: flex; justify-content: space-around; align-items: center; font-size: 13px; color: #94a3b8; }
        .env-item span { color: #f8fafc; font-weight: bold; }
        
        /* 3. BẢNG ĐIỀU KHIỂN */
        .dashboard { height: 340px; flex-shrink: 0; background: #1e293b; display: flex; flex-direction: column; padding: 12px 25px; box-sizing: border-box; }
        .device-tabs { display: flex; flex-shrink: 0; gap: 15px; justify-content: center; margin-bottom: 15px; overflow-x: auto; padding-bottom: 4px;}
        .tab-btn { background: #334155; color: #cbd5e1; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; font-size: 13px;}
        .tab-btn.active, .tab-btn:hover { background: #3b82f6; color: white; }

        .control-panels { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; overflow-y: auto; }
        .panel { display: none; width: 100%; max-width: 500px; text-align: center; }
        .panel.active { display: block; }
        
        .slider-group { margin-bottom: 15px; text-align: left;}
        .slider-group label { font-size: 12px; color: #cbd5e1; display: flex; justify-content: space-between; margin-bottom: 5px;}
        input[type="range"] { width: 100%; height: 6px; background: #475569; border-radius: 4px; outline: none; -webkit-appearance: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #3b82f6; border-radius: 50%; border: 2px solid #fff; }

        .tv-controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .btn-circle { width: 38px; height: 38px; border-radius: 50%; border: none; background: #475569; color: white; font-size: 14px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-circle:hover { background: #64748b; }
        .btn-power { background: #ef4444; } .btn-power.on { background: #10b981; }

        /* Nút phụ trợ (Chế độ AC, Về phẳng giường) */
        .mode-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;}
        .btn-mode { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 6px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; transition: 0.2s;}
        .btn-mode.active { background: #3b82f6; color: white; border-color: #3b82f6;}

        .voice-section { text-align: center; margin-top: 5px; flex-shrink: 0; }
        .mic-btn { background: linear-gradient(135deg, #ef4444 0%, #f43f5e 100%); color: white; border: none; padding: 10px 30px; border-radius: 20px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }
        #voice-status { display: block; margin-top: 10px; font-size: 14px; font-weight: bold; min-height: 20px;}
    </style>
</head>
<body>

    <div class="visualizer-grid">
        <!-- ĐIỀU HÒA -->
        <div class="widget" id="widget-ac">
            <div class="widget-title">ĐIỀU HÒA</div>
            <div class="icon-box" id="icon-ac">❄️</div>
            <div id="ac-temp-display">--°C</div>
            <div id="ac-status">TẮT</div>
        </div>

        <!-- ĐÈN TRẦN -->
        <div class="widget" id="widget-light-main">
            <div class="widget-title">ĐÈN TRẦN</div>
            <div class="icon-box lamp-icon" id="icon-light-main">💡</div>
        </div>

        <!-- GIƯỜNG -->
        <div class="widget" id="widget-bed">
            <div class="widget-title">GIƯỜNG THÔNG MINH</div>
            <div class="css-bed">
                <div class="bed-base"></div>
                <div class="bed-foot"></div>
                <div class="bed-head" id="css-bed-head">
                    <div class="bed-pillow"></div>
                </div>
            </div>
        </div>

        <!-- TIVI -->
        <div class="widget" id="widget-tv">
            <div class="widget-title">TIVI THÔNG MINH</div>
            <div class="tv-frame">
                <div class="tv-screen" id="tv-screen">
                    <div class="tv-logo" id="tv-text"></div>
                    <div class="tv-vol-ui" id="tv-vol-display"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="environment-bar">
        <div class="env-item">📅 Ngày: <span id="env-date">--/--/----</span></div>
        <div class="env-item">⏰ Thời gian: <span id="env-time">--:--:--</span></div>
        <div class="env-item">🛡️ Trạng thái: <span style="color: #34d399;">Hệ thống Bảo mật Giọng nói Đang hoạt động</span></div>
    </div>

    <div class="dashboard">
        <div class="device-tabs">
            <button class="tab-btn active" onclick="switchTab('ac', this)">❄️ Điều hòa</button>
            <button class="tab-btn" onclick="switchTab('light-main', this)">💡 Đèn trần</button>
            <button class="tab-btn" onclick="switchTab('bed', this)">🛏️ Giường</button>
            <button class="tab-btn" onclick="switchTab('tv', this)">📺 Tivi</button>
        </div>

        <div class="control-panels">
            <!-- PANEL ĐIỀU HÒA -->
            <div id="panel-ac" class="panel active">
                <div class="mode-group">
                    <button class="btn-circle btn-power" id="btn-ac" onclick="toggleAC()">⏻</button>
                    <button class="btn-mode active" id="mode-lanh" onclick="setACMode('lạnh')">Làm lạnh</button>
                    <button class="btn-mode" id="mode-quat" onclick="setACMode('quạt')">Quạt</button>
                    <button class="btn-mode" id="mode-hutam" onclick="setACMode('hút ẩm')">Hút ẩm</button>
                </div>
                <div class="slider-group">
                    <label>Nhiệt độ (16-30) <span id="val-ac">24 °C</span></label>
                    <input type="range" id="slider-ac" min="16" max="30" value="24" oninput="updateDevice('ac')">
                </div>
            </div>

            <!-- PANEL ĐÈN TRẦN (Đã bỏ màu sắc) -->
            <div id="panel-light-main" class="panel">
                <button class="btn-circle btn-power" id="btn-light" onclick="toggleLight()" style="margin-bottom: 15px;">⏻</button>
                <div class="slider-group">
                    <label>Độ sáng (0-100) <span id="val-light-main">0 %</span></label>
                    <input type="range" id="slider-light-main" min="0" max="100" value="0" oninput="updateDevice('light-main')">
                </div>
            </div>

            <!-- PANEL GIƯỜNG -->
            <div id="panel-bed" class="panel">
                <button class="btn-mode" onclick="setBedFlat()" style="margin-bottom: 15px; background: #ef4444; color: white;">⬇ Hạ về phẳng (0°)</button>
                <div class="slider-group">
                    <label>Góc nâng đầu giường <span id="val-bed">0 °</span></label>
                    <input type="range" id="slider-bed" min="0" max="60" value="0" oninput="updateDevice('bed')">
                </div>
            </div>

            <!-- PANEL TIVI (Kênh 1-9 & Âm lượng) -->
            <div id="panel-tv" class="panel">
                <div class="tv-controls">
                    <button class="btn-circle btn-power" id="btn-tv" onclick="toggleTV()">⏻</button>
                </div>
                <div class="slider-group">
                    <label>Kênh Tivi (1-9) <span id="val-tv-channel">Kênh 1</span></label>
                    <input type="range" id="slider-tv-channel" min="1" max="9" value="1" oninput="updateTVDisplay()">
                </div>
                <div class="slider-group">
                    <label>Âm lượng (0-100) <span id="val-tv-vol">50</span></label>
                    <input type="range" id="slider-tv-vol" min="0" max="100" value="50" oninput="updateTVDisplay()">
                </div>
            </div>
        </div>

        <div class="voice-section">
            <button class="mic-btn" id="mic-btn" onclick="startVoiceCommand()">🎙️ Nhấn để Ra lệnh (4 giây)</button>
            <button style="margin-left:12px;background:none;border:1px solid #475569;color:#94a3b8;border-radius:12px;padding:4px 10px;font-size:12px;cursor:pointer;" onclick="document.getElementById('voice-file').click()">📁 Test file testset</button>
            <input type="file" id="voice-file" accept=".wav,audio/wav" hidden onchange="sendVoiceFile(this)">
            <a href="/record" style="margin-left:12px;color:#94a3b8;font-size:12px;">🎤 Thu mẫu / đăng ký giọng</a>
            <span id="voice-status">Sẵn sàng nhận lệnh...</span>
        </div>
    </div>

    <script>
        function switchTab(deviceId, btnElement) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('panel-' + deviceId).classList.add('active');
            btnElement.classList.add('active');
        }

        function updateEnvironmentClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const dateStr = String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + now.getFullYear();
            document.getElementById('env-date').innerText = dateStr; document.getElementById('env-time').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateEnvironmentClock, 1000); 

        // --- STATE THIẾT BỊ ---
        let acOn = false;
        let acMode = 'lạnh';
        let lightOn = false;
        let tvOn = false;
        
        // Mảng màu nền tượng trưng cho 9 kênh
        const tvChannelColors = ["#1d4ed8", "#b91c1c", "#15803d", "#c2410c", "#6d28d9", "#be185d", "#0f766e", "#a16207", "#4338ca"];

        // --- LOGIC ĐIỀU HÒA ---
        function toggleAC() { acOn = !acOn; document.getElementById('btn-ac').classList.toggle('on', acOn); updateDevice('ac'); }
        function setACMode(mode) {
            acMode = mode;
            document.getElementById('mode-lanh').classList.remove('active');
            document.getElementById('mode-quat').classList.remove('active');
            document.getElementById('mode-hutam').classList.remove('active');
            
            if(mode === 'lạnh') document.getElementById('mode-lanh').classList.add('active');
            if(mode === 'quạt') document.getElementById('mode-quat').classList.add('active');
            if(mode === 'hút ẩm') document.getElementById('mode-hutam').classList.add('active');
            updateDevice('ac');
        }

        // --- LOGIC ĐÈN TRẦN ---
        function toggleLight() {
            lightOn = !lightOn;
            document.getElementById('btn-light').classList.toggle('on', lightOn);
            document.getElementById('slider-light-main').value = lightOn ? 100 : 0;
            updateDevice('light-main');
        }

        // --- LOGIC TIVI ---
        function toggleTV() { tvOn = !tvOn; document.getElementById('btn-tv').classList.toggle('on', tvOn); updateTVDisplay(); }
        function updateTVDisplay() {
            const screen = document.getElementById('tv-screen');
            const text = document.getElementById('tv-text');
            const volUi = document.getElementById('tv-vol-display');
            
            const channel = parseInt(document.getElementById('slider-tv-channel').value);
            const volume = document.getElementById('slider-tv-vol').value;
            
            document.getElementById('val-tv-channel').innerText = `Kênh ${channel}`;
            document.getElementById('val-tv-vol').innerText = volume;
            
            if (tvOn) {
                // Hiển thị tên kênh khi bật
                screen.style.background = tvChannelColors[channel - 1];
                text.innerText = `KÊNH ${channel}`;
                text.style.color = 'white';
                volUi.innerText = `🔊 ${volume}%`;
            } else {
                screen.style.background = 'rgba(0,0,0,1)'; 
                text.innerText = "";
                volUi.innerText = "";
            }
        }

        // --- LOGIC GIƯỜNG ---
        function setBedFlat() {
            document.getElementById('slider-bed').value = 0;
            updateDevice('bed');
        }

        function updateDevice(device) {
            if (device === 'ac') {
                const temp = parseInt(document.getElementById('slider-ac').value);
                document.getElementById('val-ac').innerText = temp + ' °C';
                const widget = document.getElementById('widget-ac');
                const display = document.getElementById('ac-temp-display');
                const status = document.getElementById('ac-status');
                
                if (acOn) {
                    display.innerText = temp + ' °C'; display.style.opacity = 1; status.style.opacity = 1;
                    let modeText = "LÀM LẠNH"; let bg = 'radial-gradient(circle, #1e3a8a 0%, #1e293b 80%)';
                    
                    if(acMode === 'quạt') { modeText = "QUẠT GIÓ"; bg = 'radial-gradient(circle, #064e3b 0%, #1e293b 80%)'; }
                    if(acMode === 'hút ẩm') { modeText = "HÚT ẨM"; bg = 'radial-gradient(circle, #7f1d1d 0%, #1e293b 80%)'; }
                    
                    widget.style.background = bg;
                    status.innerText = modeText; status.style.color = '#cbd5e1';
                } else {
                    widget.style.background = '#1e293b'; display.style.opacity = 0; status.style.opacity = 0;
                }
            } 
            else if (device === 'light-main') {
                const bright = parseInt(document.getElementById('slider-light-main').value);
                document.getElementById('val-light-main').innerText = bright + ' %';
                const widget = document.getElementById('widget-light-main');
                const icon = document.getElementById('icon-light-main');
                
                if (bright > 0) {
                    lightOn = true; document.getElementById('btn-light').classList.add('on');
                    // Gắn cứng màu trắng ấm (Warm White) vì đã bỏ thanh trượt màu
                    const rgb = '255, 235, 170'; 
                    widget.style.background = `radial-gradient(circle, rgba(${rgb}, ${bright/100}) 0%, #1e293b ${60 + bright/2}%)`;
                    icon.style.color = `rgb(${rgb})`; icon.style.filter = `drop-shadow(0 0 ${bright/4}px rgb(${rgb}))`;
                } else {
                    lightOn = false; document.getElementById('btn-light').classList.remove('on');
                    widget.style.background = '#1e293b'; icon.style.color = '#475569'; icon.style.filter = 'none';
                }
            }
            else if (device === 'bed') {
                const val = document.getElementById('slider-bed').value;
                document.getElementById('val-bed').innerText = val + ' °';
                document.getElementById('css-bed-head').style.transform = `rotate(${val}deg)`;
            }
        }

        // --- XỬ LÝ ÂM THANH ---
        const VOICE_SR = 16000, VOICE_SEC = 4;
        let voiceBusy = false;
        const REASON_VI = {
            no_speech: 'Không nghe thấy tiếng nói',
            noise: 'Chỉ có tiếng ồn',
            unknown_command: 'Không nhận ra lệnh',
            ambiguous_device: 'Không rõ lệnh dành cho thiết bị nào',
            invalid_value: 'Giá trị nằm ngoài khoảng cho phép',
            unauthorized_speaker: 'Giọng nói không được phép'
        };

        function setVoiceStatus(msg, color) { document.getElementById('voice-status').innerText = msg; document.getElementById('voice-status').style.color = color || '#cbd5e1'; }

        function encodeWav(f) {
            const b = new ArrayBuffer(44 + f.length * 2), v = new DataView(b);
            const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
            w(0, 'RIFF'); v.setUint32(4, 36 + f.length * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
            v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, VOICE_SR, true);
            v.setUint32(28, VOICE_SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
            w(36, 'data'); v.setUint32(40, f.length * 2, true);
            f.forEach((s, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 0x7fff, true));
            return new Blob([b], { type: 'audio/wav' });
        }

        async function startVoiceCommand() {
            if (voiceBusy) return;
            let stream;
            try { stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); } 
            catch (e) { setVoiceStatus('Lỗi: Cần cho phép quyền truy cập Micro.', '#ef4444'); return; }
            
            voiceBusy = true; document.getElementById('mic-btn').disabled = true;
            try {
            const ctx = new AudioContext(), src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1);
            const chunks = [], need = Math.round(VOICE_SEC * ctx.sampleRate);
            
            let timeLeft = VOICE_SEC;
            setVoiceStatus(`🔴 Đang ghi âm... Hãy đọc lệnh (${timeLeft}s)`, '#fbbf24');
            const timerId = setInterval(() => {
                timeLeft -= 1;
                if (timeLeft > 0) setVoiceStatus(`🔴 Đang ghi âm... Hãy đọc lệnh (${timeLeft}s)`, '#fbbf24');
            }, 1000);

            await new Promise(res => {
                let got = 0;
                proc.onaudioprocess = e => {
                    const d = new Float32Array(e.inputBuffer.getChannelData(0)); chunks.push(d); got += d.length;
                    if (got >= need) { proc.onaudioprocess = null; clearInterval(timerId); res(); }
                };
                src.connect(proc); proc.connect(ctx.destination);
            });
            proc.disconnect(); src.disconnect(); stream.getTracks().forEach(t => t.stop());
            const sr = ctx.sampleRate; await ctx.close();
            {
                const n = Math.round(VOICE_SEC * sr), raw = new Float32Array(n); let o = 0;
                for (const c of chunks) { if (o >= n) break; raw.set(c.subarray(0, Math.min(c.length, n - o)), o); o += c.length; }
                const off = new OfflineAudioContext(1, VOICE_SEC * VOICE_SR, VOICE_SR);
                const ab = off.createBuffer(1, n, sr); ab.copyToChannel(raw, 0);
                const s = off.createBufferSource(); s.buffer = ab; s.connect(off.destination); s.start();
                const data = (await off.startRendering()).getChannelData(0);
                await sendVoice(encodeWav(data));
            }
            } catch (e) {
                stream.getTracks().forEach(t => t.stop());
                setVoiceStatus('Lỗi khi ghi âm: ' + e.message, '#ef4444');
            } finally { voiceBusy = false; document.getElementById('mic-btn').disabled = false; }
        }

        async function sendVoiceFile(input) {
            const f = input.files[0]; input.value = '';
            if (f) await sendVoice(f);
        }

        async function sendVoice(blob) {
            setVoiceStatus('⏳ Đang xử lý đối chiếu hệ thống...', '#fbbf24');
            const fd = new FormData(); fd.append('audio_data', blob, 'command.wav');
            try {
                const r = await fetch('/process-audio', { method: 'POST', body: fd });
                const j = await r.json().catch(() => ({ error: 'Server trả lỗi ' + r.status }));
                const heard = j.text ? ` - nghe được: "${j.text}"` : '';
                const score = j.speaker_score != null ? ` (điểm giọng ${j.speaker_score})` : '';
                if (j.status === 'ok') {
                    if (applyVoiceAction(j)) setVoiceStatus(`✓ Thành công: [${j.speaker}]${heard}${score}`, '#10b981');
                } else {
                    const errorMsg = j.message || REASON_VI[j.reason] || j.reason || j.error || 'Lỗi không xác định';
                    setVoiceStatus(`❌ TỪ CHỐI: ${errorMsg}${heard}${score}`, '#ef4444');
                }
            } catch (e) { setVoiceStatus('Lỗi: Không kết nối được Backend.', '#ef4444'); }
        }

        // Lệnh từ server: {device, action, target, value}
        //   action: bật | tắt | tăng | giảm | đặt
        //   target: nhiệt độ | chế độ | độ sáng | góc | kênh | âm lượng (bỏ trống với bật/tắt)
        function adjustSlider(id, j, lo, hi) {
            const el = document.getElementById(id), cur = parseInt(el.value), v = Number(j.value);
            if (Number.isNaN(v)) return true;
            const t = j.action === 'tăng' ? cur + v : j.action === 'giảm' ? cur - v : v;
            if (t < lo || t > hi) {
                setVoiceStatus(`❌ TỪ CHỐI: kết quả ${t} nằm ngoài khoảng ${lo}–${hi} (hiện tại ${cur})`, '#ef4444');
                return false;
            }
            el.value = t;
            return true;
        }

        function applyVoiceAction(j) {
            const mapId = { 'điều hòa': 'ac', 'đèn trần': 'light-main', 'giường': 'bed', 'tivi': 'tv' };
            const deviceId = mapId[j.device];
            if (!deviceId) return false;
            const tab = document.querySelector(`.tab-btn[onclick*="'${deviceId}'"]`);
            if (tab) switchTab(deviceId, tab);

            if (deviceId === 'ac') {
                if (j.action === 'bật') { acOn = true; document.getElementById('btn-ac').classList.add('on'); }
                if (j.action === 'tắt') { acOn = false; document.getElementById('btn-ac').classList.remove('on'); }
                if (j.target === 'nhiệt độ' && !adjustSlider('slider-ac', j, 16, 30)) return false;
                if (j.target === 'chế độ' && j.value != null) { setACMode(j.value); return true; }
                if (j.mode) setACMode(j.mode); else updateDevice('ac');
            }
            else if (deviceId === 'light-main') {
                if (j.action === 'bật') document.getElementById('slider-light-main').value = j.value || 100;
                if (j.action === 'tắt') document.getElementById('slider-light-main').value = 0;
                if (j.target === 'độ sáng' && !adjustSlider('slider-light-main', j, 0, 100)) return false;
                updateDevice('light-main');
            }
            else if (deviceId === 'bed') {
                if (j.target === 'góc' && !adjustSlider('slider-bed', j, 0, 60)) return false;
                updateDevice('bed');
            }
            else if (deviceId === 'tv') {
                if (j.action === 'bật') { tvOn = true; document.getElementById('btn-tv').classList.add('on'); }
                if (j.action === 'tắt') { tvOn = false; document.getElementById('btn-tv').classList.remove('on'); }
                if (j.target === 'kênh' && !adjustSlider('slider-tv-channel', j, 1, 9)) return false;
                if (j.target === 'âm lượng' && !adjustSlider('slider-tv-vol', j, 0, 100)) return false;
                updateTVDisplay();
            }
            return true;
        }
    </script>
</body>
</html>
